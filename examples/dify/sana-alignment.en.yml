    - data:
        code: |-
          import json

          def main(body: str, status_code: int) -> dict:
              if status_code != 200:
                  raise ValueError("SANA HTTP request failed")

              try:
                  data = json.loads(body)
              except (json.JSONDecodeError, TypeError):
                  raise ValueError("SANA response is not valid JSON") from None

              if not isinstance(data, dict) or data.get("schema_version") != "0.4.0":
                  raise ValueError("Unexpected SANA response schema")

              status = data.get("status")
              allowed = {
                  "handshake", "unknown", "context_insufficient",
                  "revision_required", "needs_clarification",
                  "mapped", "mapped_with_divergence",
              }

              if not isinstance(status, str) or status not in allowed:
                  raise ValueError("Unexpected SANA alignment status")

              return {
                  "alignment_status": status,
                  "alignment_json": json.dumps(data, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          alignment_json:
            children: null
            type: string
          alignment_status:
            children: null
            type: string
        selected: false
        title: Parse response
        type: code
        variables:
