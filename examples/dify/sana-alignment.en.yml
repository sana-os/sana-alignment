    - data:
        code: |-
          import json

          def main(
              input_message: str,
              ai_interpretation: str = "",
              language: str = ""
          ) -> dict:
              if not isinstance(input_message, str) or not input_message.strip():
                  raise ValueError("input_message is required")

              payload = {
                  "input_message": input_message,
                  "language": (language or "").strip() or "en",
              }

              if ai_interpretation and ai_interpretation.strip():
                  payload["ai_interpretation"] = ai_interpretation

              return {
                  "request_body": json.dumps(payload, ensure_ascii=False)
              }
