          "data": {
            "code": "import json\n\ndef main(\n    input_message: str,\n    ai_interpretation: str = \"\",\n    language: str = \"\"\n) -> dict:\n    if not isinstance(input_message, str) or not input_message.strip():\n        raise ValueError(\"input_message is required\")\n\n    if not isinstance(ai_interpretation, str) or not ai_interpretation.strip():\n        raise ValueError(\"Planning model returned no proposal\")\n    if len(input_message) > 6000 or len(ai_interpretation) > 6000:\n        raise ValueError(\"Request or proposal exceeds 6000 characters; shorten explicitly, never truncate\")\n\n    payload = {\n        \"input_message\": input_message,\n        \"language\": (language or \"\").strip() or \"en\",\n        \"processing_mode\": \"medium\",\n    }\n\n    if ai_interpretation and ai_interpretation.strip():\n        payload[\"ai_interpretation\"] = ai_interpretation\n\n    return {\n        \"request_body\": json.dumps(payload, ensure_ascii=False)\n    }",
