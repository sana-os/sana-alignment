services:
  sana:
    build: .
    image: sana-alignment:0.5.15
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - alignment_traces:/app/traces
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  alignment_traces:
